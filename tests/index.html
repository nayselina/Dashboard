<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BatStat tests</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <!-- Open through the local server (e.g. http://localhost/dashboard/tests/) or run tests/run-tests.sh. -->
  <style>
    :root { --ink: #29252A; --muted: #6B6368; --line: #EEE6E6; --good: #22654A; --good-bg: #E8F3EE; --bad: #8F1729; --bad-bg: #F9E4E7; }
    body { margin: 0; padding: 24px 16px 48px; background: #FAF7F5; color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
    main { max-width: 980px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p.lead { margin: 0 0 16px; color: var(--muted); }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
    button { height: 36px; padding: 0 14px; border: 1px solid #DED3D4; border-radius: 10px; background: #fff; font: inherit; cursor: pointer; }
    .summary { padding: 6px 12px; border-radius: 999px; background: #F0ECEE; font-weight: 600; }
    .summary.pass { background: var(--good-bg); color: var(--good); }
    .summary.fail { background: var(--bad-bg); color: var(--bad); }
    label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    li { display: grid; grid-template-columns: 52px 1fr; gap: 2px 10px; padding: 7px 12px; border-top: 1px solid var(--line); }
    li.suite { display: block; padding: 10px 12px 6px; font-weight: 700; background: #FBF8F7; }
    li:first-child { border-top: 0; }
    .badge { font-size: 11.5px; font-weight: 700; }
    li.pass .badge { color: var(--good); }
    li.fail { background: var(--bad-bg); }
    li.fail .badge { color: var(--bad); }
    .detail { grid-column: 2; color: var(--bad); font-size: 13px; }
    .detail:empty { display: none; }
    body.failures-only li.pass { display: none; }
    #stage { position: fixed; left: -10000px; top: 0; }
    #stage iframe { border: 0; display: block; }
    #report { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>BatStat tests</h1>
    <p class="lead">Loads the real dashboard and checks its data, numbers, requirements, interactions, privacy rules, accessibility and layout.</p>
    <div class="bar">
      <button type="button" id="rerun">Run again</button>
      <span class="summary" id="summary" role="status">Running…</span>
      <label><input type="checkbox" id="onlyFail"> Show failures only</label>
    </div>
    <ul id="results" aria-live="polite"></ul>
  </main>
  <div id="stage" aria-hidden="true"></div>
  <pre id="report"></pre>

  <script src="../js/data.js"></script>
  <script src="runner.js"></script>
  <script src="suites.js"></script>
  <script>
    document.getElementById('rerun').addEventListener('click', () => location.reload());
    document.getElementById('onlyFail').addEventListener('change', e => document.body.classList.toggle('failures-only', e.target.checked));
    runAll();
  </script>
</body>
</html>
